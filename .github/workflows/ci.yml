name: Comando - CI e SAST

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Testes e analise de seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testes automatizados Laravel
        run: |
          docker compose -f compose.test.yaml run --rm --build test

      - name: Validar build do React
        run: |
          docker compose -f compose.test.yaml run --rm --build frontend-build

      - name: Limpar ambiente de testes
        if: always()
        run: |
          docker compose -f compose.test.yaml down -v --remove-orphans

      - name: Verificar configuracao do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN nao configurado"
            exit 1
          fi

      - name: Executar SAST no SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
